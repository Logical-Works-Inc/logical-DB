# logical-DB CI plan — rendered to .github/workflows/ci.yml by keel-ci-plan.
#
# Regenerate after ANY edit to this file (the rendered workflow is canonical).
# keel-ci-plan needs ci/keel-ci.toml AND a keel-core/Cargo.toml marker in the
# repo root; this repo deliberately has no keel-core crate yet. Stage a root:
#   root=$(mktemp -d)
#   cp -R ci "$root/ci"; mkdir "$root/keel-core"
#   printf '[package]\nname="marker"\nversion="0.0.0"\nedition="2021"\n' \
#     > "$root/keel-core/Cargo.toml"
#   (cd "$root" && "$HOME/keel/keel-core/target/release/keel-ci-plan" generate)
#   cp "$root/.github/workflows/ci.yml" .github/workflows/ci.yml
# The `ci-plan-current` job below enforces exactly this byte-equality in CI.
#
# Gates reference ONLY things that exist in this repository today (markdown
# spec + governance docs + scripts/spec-lint.py) plus the installed keel
# binary's portable tools (differential, differential-selftest). Cargo jobs
# self-skip until kernel/ lands with DB-A — the guard is loud, not silent,
# so a future Cargo.toml activates them without editing this plan.
version = 1
name = "Keel CI"
generated_workflow = ".github/workflows/ci.yml"
full_timeout_minutes = 30
finalizer_reserve_seconds = 120
max_parallel_jobs = 4
shell = "bash"
shell_args = ["--noprofile", "--norc", "-e", "-o", "pipefail"]

[github]
events = ["push-main", "pull-request", "workflow-dispatch"]
runner = ["self-hosted"]
concurrency_group = "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
cancel_in_progress = "${{ github.event_name == 'pull_request' }}"

[github.permissions]
contents = "read"
actions = "read"
pull_requests = "read"

[env]
CARGO_BUILD_JOBS = "4"
CARGO_INCREMENTAL = "0"
KEEL_RUN_ID = "${{ github.run_id }}"
KEEL_EVENT = "${{ github.event_name }}"
KEEL_REPOSITORY = "${{ github.repository }}"
KEEL_WORKSPACE = "${{ github.workspace }}"
KEEL_BASE_REF = "${{ ci.base_ref }}"
KEEL_BASE_SHA = "${{ ci.base_sha }}"
KEEL_HEAD_SHA = "${{ ci.head_sha }}"

[runtime_env]
KEEL_RUN_ROOT = "$HOME/.keel-ci/runs/$KEEL_RUN_ID"
KEEL_DIFFERENTIAL_DIR = "$KEEL_RUN_ROOT/differential"
KEEL_EVIDENCE_DIR = "$KEEL_RUN_ROOT/evidence"

[[job]]
id = "stack-position"
name = "Stack -- bottom of the stack only"
needs = []
condition = "success()"
timeout_minutes = 2
cost = "deterministic"
working_directory = "."
runner = ["self-hosted"]
evidence = ["log", "status"]
[[job.step]]
name = "Refuse a PR whose base is itself an open PR"
condition = "success()"
kind = "run"
run = '''set -u
if [ "$EVENT" != "pull_request" ]; then
  echo "OK   $EVENT carries no stack position; the tiers run."
  exit 0
fi
blocker="$(gh pr list --repo "$REPO" --state open --head "$BASE" --json number,title --jq '.[0] | select(.) | "#\(.number) \(.title)"' 2>/dev/null || true)"
if [ -z "$blocker" ]; then
  echo "OK   base '$BASE' has no open pull request, so this is the bottom."
  exit 0
fi
echo "FAIL This PR is not the bottom of its stack." >&2
echo "     Its base '$BASE' is still an open pull request: $blocker" >&2
exit 1
'''
[job.step.env]
GH_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
EVENT = "${{ github.event_name }}"
BASE = "${{ github.event.pull_request.base.ref }}"
REPO = "${{ github.repository }}"

[[job]]
id = "change-scope"
name = "Scope — code vs docs only"
needs = []
condition = "success()"
timeout_minutes = 3
cost = "deterministic"
working_directory = "."
runner = ["self-hosted"]
evidence = ["log", "status"]
[job.outputs]
code_changed = "${{ steps.scope.outputs.code_changed }}"
[[job.step]]
condition = "success()"
kind = "action"
uses = "actions/checkout@v4"
local_action = "checkout"
[job.step.with]
fetch_depth = "0"
[[job.step]]
id = "base"
name = "Resolve the scope base ref"
condition = "success()"
kind = "run"
run = '''set -eu
echo "SCOPE_BASE=$KEEL_BASE_REF" >> "$GITHUB_ENV"
'''
[[job.step]]
name = "Prove the differential gate can emit BOTH verdicts (self-test)"
condition = "success()"
kind = "run"
run = '''keel differential-selftest'''
[[job.step]]
id = "scope"
name = "Decide whether code changed (or docs only)"
condition = "success()"
kind = "run"
run = '''set -eu
keel differential "$SCOPE_BASE" "$KEEL_DIFFERENTIAL_DIR" | tee "$RUNNER_TEMP/keel-differential.out"
eval "$(grep -E '^(code_changed|differential_dir)=' "$RUNNER_TEMP/keel-differential.out")"
echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
'''
shell = "bash"

[[job]]
id = "spec-lint"
name = "Spec — 80-column prose contract"
needs = ["stack-position"]
condition = "success()"
timeout_minutes = 2
cost = "deterministic"
working_directory = "."
runner = ["self-hosted"]
evidence = ["log", "status"]
[[job.step]]
name = "Self-test the lint gate (proves it can still fail)"
condition = "success()"
kind = "run"
run = '''set -eu
bad="$(mktemp /tmp/ldb-lint-teeth-XXXXXX).md"
python3 -c "open('$bad','w').write('a'*81+'\n')"
if python3 scripts/spec-lint.py "$bad" >/dev/null 2>&1; then
  echo "FAIL spec-lint accepted an 81-column line — the gate has no teeth." >&2
  exit 1
fi
rm -f "$bad"
echo "OK   spec-lint refuses overlong prose."
'''
[[job.step]]
name = "Enforce the 80-column contract on all markdown"
condition = "success()"
kind = "run"
run = '''python3 scripts/spec-lint.py'''

[[job]]
id = "test"
name = "Test — cargo test --workspace"
needs = ["stack-position", "change-scope"]
condition = "success()"
timeout_minutes = 15
cost = "expensive"
working_directory = "."
runner = ["self-hosted"]
evidence = ["log", "status"]
[job.runtime_env]
CARGO_TARGET_DIR = "$KEEL_RUN_ROOT/target"
[[job.step]]
name = "Run every workspace suite"
condition = "needs.change-scope.outputs.code_changed == 'yes'"
kind = "run"
run = '''set -eu
if [ ! -f Cargo.toml ]; then
  echo "SKIP no workspace yet — activates with DB-A kernel/."
  exit 0
fi
cargo test --workspace'''

[[job]]
id = "fmt"
name = "Format — rustfmt (workspace)"
needs = ["stack-position"]
condition = "success()"
timeout_minutes = 3
cost = "deterministic"
working_directory = "."
runner = ["self-hosted"]
evidence = ["log", "status"]
[[job.step]]
name = "Self-test the fmt gate (proves it can still fail)"
condition = "success()"
kind = "run"
run = '''set -eu
bad="$(mktemp /tmp/ldb-fmt-teeth-XXXXXX).rs"
printf 'fn    badly( )->{1}\n' > "$bad"
if rustfmt --edition 2021 --check "$bad" >/dev/null 2>&1; then
  echo "FAIL fmt gate accepted misformatted input — the gate has no teeth." >&2
  exit 1
fi
rm -f "$bad"
echo "OK   fmt gate refuses misformatted input."
'''
[[job.step]]
name = "Check formatting"
condition = "success()"
kind = "run"
run = '''set -eu
if [ ! -f Cargo.toml ]; then
  echo "SKIP no workspace yet — activates with DB-A kernel/."
  exit 0
fi
cargo fmt --all -- --check'''

[[job]]
id = "clippy"
name = "Lint — clippy zero warnings"
needs = ["stack-position", "change-scope"]
condition = "success()"
timeout_minutes = 10
cost = "expensive"
working_directory = "."
runner = ["self-hosted"]
evidence = ["log", "status"]
[job.runtime_env]
CARGO_TARGET_DIR = "$KEEL_RUN_ROOT/target"
[[job.step]]
name = "Clippy with warnings denied"
condition = "needs.change-scope.outputs.code_changed == 'yes'"
kind = "run"
run = '''set -eu
if [ ! -f Cargo.toml ]; then
  echo "SKIP no workspace yet — activates with DB-A kernel/."
  exit 0
fi
cargo clippy --workspace --all-targets -- -D warnings'''

[[job]]
id = "ci-plan-current"
name = "Canonical CI — generated workflow is current"
needs = ["stack-position"]
condition = "success()"
timeout_minutes = 2
cost = "deterministic"
working_directory = "."
runner = ["self-hosted"]
evidence = ["log", "status"]
[[job.step]]
name = "Regenerate and byte-check GitHub Actions"
condition = "success()"
kind = "run"
run = '''set -eu
plan_bin="$HOME/keel/keel-core/target/release/keel-ci-plan"
if [ ! -x "$plan_bin" ]; then
  echo "FAIL keel-ci-plan binary not found at $plan_bin — build keel first." >&2
  exit 1
fi
root="$(mktemp -d)"
cp -R ci "$root/ci"
mkdir "$root/keel-core"
printf '[package]\nname="marker"\nversion="0.0.0"\nedition="2021"\n' > "$root/keel-core/Cargo.toml"
(cd "$root" && "$plan_bin" generate)
if ! diff -u .github/workflows/ci.yml "$root/.github/workflows/ci.yml"; then
  echo "FAIL .github/workflows/ci.yml is stale; regenerate it from ci/keel-ci.toml" >&2
  exit 1
fi
rm -rf "$root"
echo "OK   generated workflow is byte-current with ci/keel-ci.toml."
'''

[[job]]
id = "eval-log"
name = "Eval Log — compiled run observability"
needs = ["stack-position", "change-scope", "spec-lint", "test", "fmt", "clippy", "ci-plan-current"]
condition = "always()"
timeout_minutes = 1
cost = "epilogue"
working_directory = "."
runner = ["self-hosted"]
evidence = ["log", "status"]
eval_log = true
[[job.step]]
condition = "success()"
kind = "action"
uses = "actions/checkout@v4"
local_action = "checkout"
[[job.step]]
name = "Compile and compare canonical eval JSONL"
condition = "always()"
kind = "eval"
[[job.step]]
name = "Upload eval log"
condition = "always()"
kind = "action"
uses = "actions/upload-artifact@v4"
local_action = "upload-artifact"
[job.step.with]
name = "eval-log"
path = "eval.jsonl"
if_no_files_found = "error"

[[job]]
id = "cleanup"
name = "Cleanup — fresh state for next run"
needs = ["eval-log"]
condition = "always()"
timeout_minutes = 1
cost = "cleanup"
working_directory = "."
runner = ["self-hosted"]
evidence = ["log", "status"]
cleanup = true
[job.runtime_env]
CARGO_TARGET_DIR = "$KEEL_RUN_ROOT/target"
[[job.step]]
name = "Remove only current-run work; preserve evidence"
condition = "always()"
kind = "run"
run = '''set -eu
rm -rf "$KEEL_RUN_ROOT/work" "$CARGO_TARGET_DIR" "$KEEL_DIFFERENTIAL_DIR"
echo "Cleaned only current-run work; evidence retained at $KEEL_EVIDENCE_DIR"
'''

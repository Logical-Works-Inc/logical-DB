license = "MIT OR Apache-2.0"
allowed_consumers = "logical-db-store"
allowed_kinds = "normal"
reason = "A crash-safe embedded B-tree keyspace is not provided by std and is a storage engine, not a primitive."
approved_by = "Director"
approved_on = "2026-09-13"
review = "https://github.com/srinji-kaggss/logical-DB/pull/45"


# ── Serialization and wire encoding ─────────────────────────────────────────
# Derives route through `lgwks_std::json::{Serialize, Deserialize}`, the
# estate's re-export of the serde crate, so no logical-db crate declares
# `serde` directly. CBOR and byte-string framing are the versioned wire
# format and have no estate or std module yet.

[[approved]]
crate = "serde_bytes"
tier = "boundary"
version = "=0.11.19"
owner = "logical-db-protocol"
capability = "encoding.byte-strings"
source = "registry"
license = "MIT OR Apache-2.0"
allowed_consumers = "logical-db-protocol,logical-db-http,logical-db-server"
allowed_kinds = "normal,dev"
reason = "CBOR byte-string framing avoids array-of-integers encoding that inflates bounded wire payloads."
approved_by = "Director"
approved_on = "2026-09-13"
review = "https://github.com/srinji-kaggss/logical-DB/pull/45"


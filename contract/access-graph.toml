# `evidence/SOURCES.md`.

# Checked execution-access contract for issue #25. This is a source-anchored
# transition registry, not a grant of storage or host authority.
version = 2

[[resource]]
name = "replica.state"
owner = "logical-db-store"
durability = "durable"

[[resource]]
name = "replica.outbox"
owner = "logical-db-store"
durability = "durable"

[[resource]]
name = "sync.checkpoint"
owner = "logical-db-store"
durability = "durable"

[[resource]]
name = "sync.session"
owner = "logical-db-server"
durability = "ephemeral"

[[resource]]
name = "schema.generation"
owner = "logical-db-store"
durability = "durable"

[[resource]]
name = "migration.state"
owner = "logical-db-store"
durability = "durable"

[[resource]]
name = "service.retention"
owner = "logical-db-service"
durability = "durable"

[[resource]]
name = "service.request"
owner = "logical-db-service"
durability = "ephemeral"

[[system]]
name = "embedded.edit"
owner = "logical-db"
source = "crates/logical-db/src/lib.rs#Database::edit"
kind = "commit"
reads = ["replica.state", "replica.outbox"]
writes = ["replica.state", "replica.outbox"]
receipt = "operation"
predecessors = []
limit = "one document and MAX_CHANGE_BYTES"
atomicity = "state and outbox commit together"
failure = "typed error leaves durable state unchanged"

[[system]]
name = "embedded.migrate"
owner = "logical-db"
source = "crates/logical-db/src/lib.rs#Database::migrate_schema"
kind = "migration"
reads = ["replica.state", "schema.generation", "migration.state"]
writes = ["schema.generation", "migration.state"]
receipt = "migration page"
predecessors = ["embedded.edit"]
limit = "revision-checked bounded page"
atomicity = "page and durable cursor commit together"
failure = "typed error preserves the prior cursor"

[[system]]
name = "embedded.remote-page"
owner = "logical-db"
source = "crates/logical-db/src/lib.rs#Database::install_remote_page"
kind = "replication"
reads = ["replica.state", "sync.checkpoint"]
writes = ["replica.state", "sync.checkpoint"]
receipt = "remote page checkpoint"
predecessors = ["sync.push-pull"]
limit = "MAX_MATERIALIZED_PAGE_BYTES"
atomicity = "remote documents and checkpoint commit together"
failure = "typed error leaves documents and checkpoint unchanged"

[[system]]
name = "embedded.baseline-install"
owner = "logical-db"
source = "crates/logical-db/src/lib.rs#Database::install_baseline"
kind = "recovery"
reads = ["replica.state", "sync.checkpoint"]
writes = ["replica.state", "sync.checkpoint"]
receipt = "baseline checkpoint"
predecessors = ["sync.recovery"]
limit = "validated bounded baseline artifact"
atomicity = "baseline state and checkpoint commit together"
failure = "typed error leaves state and checkpoint unchanged"

[[system]]
name = "sync.push-pull"
owner = "logical-db-sync"
source = "crates/logical-db-sync/src/lib.rs#synchronize"
kind = "synchronization"
reads = ["replica.outbox", "sync.checkpoint", "sync.session"]
writes = ["sync.checkpoint"]
receipt = "sync report"
predecessors = ["http.push", "http.pull"]
limit = "SyncLimits bounded page and cycle"
atomicity = "each accepted pull page installs atomically"
failure = "typed error preserves the prior checkpoint"

[[system]]
name = "sync.recovery"
owner = "logical-db-sync"
source = "crates/logical-db-sync/src/lib.rs#install_recovery"
kind = "recovery"
reads = ["sync.checkpoint", "sync.session"]
writes = ["sync.checkpoint"]
receipt = "recovery report"
predecessors = ["http.recovery"]
limit = "SyncLimits recovery_pages and recovery_bytes"
atomicity = "only the final baseline install advances the checkpoint"
failure = "typed error preserves the prior checkpoint"

[[system]]
name = "http.admission"
owner = "logical-db-server"
source = "crates/logical-db-server/src/lib.rs#admit_request"
kind = "admission"
reads = ["service.request"]
writes = ["sync.session"]
receipt = "admission response"
predecessors = []
limit = "MAX_IN_FLIGHT_REQUESTS and deadline"
atomicity = "permit lifetime encloses one request"
failure = "busy or deadline response has no service mutation"

[[system]]
name = "http.push"
owner = "logical-db-server"
source = "crates/logical-db-server/src/lib.rs#async fn push"
kind = "http"
reads = ["service.request", "service.retention"]
writes = ["service.request"]
receipt = "push response"
predecessors = ["http.admission"]
limit = "MAX_HTTP_BODY_BYTES and deadline"
atomicity = "service admission is one request transaction"
failure = "typed response exposes no partial admission"

[[system]]
name = "http.pull"
owner = "logical-db-server"
source = "crates/logical-db-server/src/lib.rs#async fn pull"
kind = "http"
reads = ["service.request", "service.retention"]
writes = ["service.request"]
receipt = "pull response"
predecessors = ["http.admission"]
limit = "MAX_HTTP_BODY_BYTES and deadline"
atomicity = "response is derived from one validated request"
failure = "typed response exposes no partial page"

[[system]]
name = "http.recovery"
owner = "logical-db-server"
source = "crates/logical-db-server/src/lib.rs#async fn recover"
kind = "http"
reads = ["service.request", "service.retention"]
writes = ["service.request"]
receipt = "baseline response"
predecessors = ["http.admission"]
limit = "MAX_HTTP_BODY_BYTES and deadline"
atomicity = "response is derived from one sealed baseline page"
failure = "typed response exposes no partial baseline"

[[system]]
name = "service.retention"
owner = "logical-db-service"
source = "crates/logical-db-service/src/lib.rs#pub async fn prune"
kind = "recovery"
reads = ["service.retention", "service.request"]
writes = ["service.retention"]
receipt = "prune receipt"
predecessors = ["http.recovery"]
limit = "validated bounded baseline page"
atomicity = "baseline validation and history deletion share one transaction"
failure = "typed error retains the history prefix"

[package]
name = "logical-db-store-fdb"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Without `fdb` the library compiles to its format constants only; the model,
# protocol, service, JSON and error edges serve the adapter (`fdb`) and its
# unit tests.
[dependencies]
foundationdb = { workspace = true, optional = true }
foundationdb-tuple.workspace = true
logical-db-model = { version = "0.1.0", path = "../logical-db-model", optional = true }
logical-db-protocol = { version = "0.1.0", path = "../logical-db-protocol", optional = true }
logical-db-service = { version = "0.1.0", path = "../logical-db-service", optional = true }
lgwks_std = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
lgwks_std.workspace = true
thiserror.workspace = true
logical-db-model = { version = "0.1.0", path = "../logical-db-model" }
logical-db-protocol = { version = "0.1.0", path = "../logical-db-protocol" }
logical-db-service = { version = "0.1.0", path = "../logical-db-service" }

[features]
default = []
fdb = [
  "dep:foundationdb",
  "dep:lgwks_std",
  "dep:thiserror",
  "dep:logical-db-model",
  "dep:logical-db-protocol",
  "dep:logical-db-service",
]

[lints]
workspace = true

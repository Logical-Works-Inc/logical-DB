[package]
name = "logical-db-e2e"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
fdb = [
    "dep:logical-db-store-fdb",
    "logical-db-store-fdb/fdb",
    "dep:logical-db-daemon",
    "logical-db-daemon/fdb",
]

[dependencies]
axum.workspace = true
lgwks_bot.workspace = true
# `support::parse_identifier` reads JSON through the estate surface.
lgwks_std.workspace = true
logical-db = { version = "0.1.0", path = "../logical-db", features = ["http"] }
# The adapter layer (`[layers.adapter]`): `src/kv.rs` drives the cache journey
# the `kv_journey` binary ships.
logical-db-kv = { version = "0.1.0", path = "../logical-db-kv" }
# `src/bin/document_journey.rs` drives the convergent `Document` directly to
# observe concurrent conflicts, which the facade does not re-export.
logical-db-crdt = { version = "0.1.0", path = "../logical-db-crdt" }
# The journey harness is a composition layer and may import implementation
# crates. These four are what `src/support.rs` names directly: the shared
# in-memory service composition used by every black-box journey.
logical-db-model = { version = "0.1.0", path = "../logical-db-model" }
logical-db-protocol = { version = "0.1.0", path = "../logical-db-protocol" }
logical-db-server = { version = "0.1.0", path = "../logical-db-server" }
logical-db-service = { version = "0.1.0", path = "../logical-db-service" }
logical-db-store-fdb = { version = "0.1.0", path = "../logical-db-store-fdb", optional = true }
# The FDB journeys boot the client network through the daemon's one safe
# `boot_network`, so this crate writes no `unsafe` of its own.
logical-db-daemon = { version = "0.1.0", path = "../logical-db-daemon", optional = true }
uuid.workspace = true

[dev-dependencies]
ciborium.workspace = true
lgwks_deps.workspace = true
logical-db-http = { version = "0.1.0", path = "../logical-db-http" }

# Inherits the workspace anti-pattern contract unchanged.
[lints]
workspace = true

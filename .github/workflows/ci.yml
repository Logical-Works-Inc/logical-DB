# @generated by keel-ci-plan from ci/keel-ci.toml; DO NOT EDIT.
name: "Keel CI"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  actions: "read"
  contents: "read"
  pull-requests: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  KEEL_BASE_REF: "${{ github.event.pull_request.base.sha || github.event.before || github.sha }}"
  KEEL_BASE_SHA: "${{ github.event.pull_request.base.sha || github.event.before || github.sha }}"
  KEEL_EVENT: "${{ github.event_name }}"
  KEEL_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
  KEEL_REPOSITORY: "${{ github.repository }}"
  KEEL_RUN_ID: "${{ github.run_id }}"
  KEEL_WORKSPACE: "${{ github.workspace }}"

defaults:
  run:
    shell: "bash"

jobs:
  stack-position:
    name: "Stack -- bottom of the stack only"
    runs-on: ["self-hosted"]
    timeout-minutes: 2
    steps:
      - name: "Refuse a PR whose base is itself an open PR"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -u
          if [ "$EVENT" != "pull_request" ]; then
            echo "OK   $EVENT carries no stack position; the tiers run."
            exit 0
          fi
          blocker="$(gh pr list --repo "$REPO" --state open --head "$BASE" --json number,title --jq '.[0] | select(.) | "#\(.number) \(.title)"' 2>/dev/null || true)"
          if [ -z "$blocker" ]; then
            echo "OK   base '$BASE' has no open pull request, so this is the bottom."
            exit 0
          fi
          echo "FAIL This PR is not the bottom of its stack." >&2
          echo "     Its base '$BASE' is still an open pull request: $blocker" >&2
          exit 1
        env:
          BASE: "${{ github.event.pull_request.base.ref }}"
          EVENT: "${{ github.event_name }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          REPO: "${{ github.repository }}"

  change-scope:
    name: "Scope — code vs docs only"
    runs-on: ["self-hosted"]
    timeout-minutes: 3
    outputs:
      code_changed: "${{ steps.scope.outputs.code_changed }}"
    steps:
      - name: "unnamed"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ env.KEEL_HEAD_SHA }}"
          fetch-depth: "0"
      - name: "Resolve the scope base ref"
        id: "base"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          echo "SCOPE_BASE=$KEEL_BASE_REF" >> "$GITHUB_ENV"
      - name: "Prove the differential gate can emit BOTH verdicts (self-test)"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          keel differential-selftest
      - name: "Decide whether code changed (or docs only)"
        id: "scope"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          keel differential "$SCOPE_BASE" "$KEEL_DIFFERENTIAL_DIR" | tee "$RUNNER_TEMP/keel-differential.out"
          eval "$(grep -E '^(code_changed|differential_dir)=' "$RUNNER_TEMP/keel-differential.out")"
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
        shell: "bash"

  spec-lint:
    name: "Spec — 80-column prose contract"
    runs-on: ["self-hosted"]
    needs: ["stack-position"]
    timeout-minutes: 2
    steps:
      - name: "Self-test the lint gate (proves it can still fail)"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          bad="$(mktemp /tmp/ldb-lint-teeth-XXXXXX).md"
          python3 -c "open('$bad','w').write('a'*81+'\n')"
          if python3 scripts/spec-lint.py "$bad" >/dev/null 2>&1; then
            echo "FAIL spec-lint accepted an 81-column line — the gate has no teeth." >&2
            exit 1
          fi
          rm -f "$bad"
          echo "OK   spec-lint refuses overlong prose."
      - name: "Enforce the 80-column contract on all markdown"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          python3 scripts/spec-lint.py

  test:
    name: "Test — cargo test --workspace"
    runs-on: ["self-hosted"]
    needs: ["stack-position", "change-scope"]
    timeout-minutes: 15
    steps:
      - name: "Run every workspace suite"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          if [ ! -f Cargo.toml ]; then
            echo "SKIP no workspace yet — activates with DB-A kernel/."
            exit 0
          fi
          cargo test --workspace

  fmt:
    name: "Format — rustfmt (workspace)"
    runs-on: ["self-hosted"]
    needs: ["stack-position"]
    timeout-minutes: 3
    steps:
      - name: "Self-test the fmt gate (proves it can still fail)"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          bad="$(mktemp /tmp/ldb-fmt-teeth-XXXXXX).rs"
          printf 'fn    badly( )->{1}\n' > "$bad"
          if rustfmt --edition 2021 --check "$bad" >/dev/null 2>&1; then
            echo "FAIL fmt gate accepted misformatted input — the gate has no teeth." >&2
            exit 1
          fi
          rm -f "$bad"
          echo "OK   fmt gate refuses misformatted input."
      - name: "Check formatting"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          if [ ! -f Cargo.toml ]; then
            echo "SKIP no workspace yet — activates with DB-A kernel/."
            exit 0
          fi
          cargo fmt --all -- --check

  clippy:
    name: "Lint — clippy zero warnings"
    runs-on: ["self-hosted"]
    needs: ["stack-position", "change-scope"]
    timeout-minutes: 10
    steps:
      - name: "Clippy with warnings denied"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          if [ ! -f Cargo.toml ]; then
            echo "SKIP no workspace yet — activates with DB-A kernel/."
            exit 0
          fi
          cargo clippy --workspace --all-targets -- -D warnings

  property-verify:
    name: "Property — replay equals the committed-prefix fold"
    runs-on: ["self-hosted"]
    needs: ["stack-position", "change-scope"]
    timeout-minutes: 5
    steps:
      - name: "Crash gauntlet: every byte cut recovers an exact batch prefix"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          if [ ! -f Cargo.toml ]; then
            echo "SKIP no workspace yet — activates with DB-A kernel/."
            exit 0
          fi
          cargo test -p ldb-kernel --test property_replay_fold

  kani-verify:
    name: "Proof — Kani harnesses over the pure layers"
    runs-on: ["self-hosted"]
    needs: ["stack-position", "change-scope"]
    timeout-minutes: 20
    steps:
      - name: "Prove the proof gate can fail (keel self-test)"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          keel kani-gate-selftest
      - name: "Verify model codec totality and journal prefix consistency"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          if [ ! -f Cargo.toml ]; then
            echo "SKIP no workspace yet — activates with DB-A kernel/."
            exit 0
          fi
          cargo kani -p ldb-kernel

  mutation-test-verify:
    name: "Teeth — cargo-mutants refuses survivors in ldb-kernel"
    runs-on: ["self-hosted"]
    needs: ["stack-position", "change-scope"]
    timeout-minutes: 25
    steps:
      - name: "Refuse survived or indeterminate mutants"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          if [ ! -f Cargo.toml ]; then
            echo "SKIP no workspace yet — activates with DB-A kernel/."
            exit 0
          fi
          cargo mutants -p ldb-kernel

  mcdc-coverage:
    name: "Coverage — MC/DC awaits the keel consumer contract (keel#480)"
    runs-on: ["self-hosted"]
    needs: ["stack-position"]
    timeout-minutes: 1
    steps:
      - name: "Loud skip until keel#480 lands the consumer shape"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          echo "SKIP MC/DC gate is keel-side work in progress: keel#480."
          echo "     This slot exists so the gap is loud in every run, not silent."
          exit 0

  ci-plan-current:
    name: "Canonical CI — generated workflow is current"
    runs-on: ["self-hosted"]
    needs: ["stack-position"]
    timeout-minutes: 2
    steps:
      - name: "Regenerate and byte-check GitHub Actions"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          plan_bin="$HOME/keel/keel-core/target/release/keel-ci-plan"
          if [ ! -x "$plan_bin" ]; then
            echo "FAIL keel-ci-plan binary not found at $plan_bin — build keel first." >&2
            exit 1
          fi
          root="$(mktemp -d)"
          cp -R ci "$root/ci"
          mkdir "$root/keel-core"
          printf '[package]\nname="marker"\nversion="0.0.0"\nedition="2021"\n' > "$root/keel-core/Cargo.toml"
          (cd "$root" && "$plan_bin" generate)
          if ! diff -u .github/workflows/ci.yml "$root/.github/workflows/ci.yml"; then
            echo "FAIL .github/workflows/ci.yml is stale; regenerate it from ci/keel-ci.toml" >&2
            exit 1
          fi
          rm -rf "$root"
          echo "OK   generated workflow is byte-current with ci/keel-ci.toml."

  eval-log:
    name: "Eval Log — compiled run observability"
    runs-on: ["self-hosted"]
    needs: ["stack-position", "change-scope", "spec-lint", "test", "fmt", "clippy", "property-verify", "kani-verify", "mutation-test-verify", "mcdc-coverage", "ci-plan-current"]
    if: ${{ always() }}
    timeout-minutes: 1
    steps:
      - name: "unnamed"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ env.KEEL_HEAD_SHA }}"
      - name: "Compile and compare canonical eval JSONL"
        if: ${{ always() }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          cat > "$KEEL_EVIDENCE_DIR/eval.jsonl" <<'KEEL_EVAL'
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"stack-position","outputs":{},"plan_sha256":"162e22a18dcdd405589471a2e5dc1209b74c3dde0be9848bb0255a03eb27362e","schema":"keel.ci.eval/v1","status":"${{ needs.stack-position.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"change-scope","outputs":{"code_changed":"${{ needs.change-scope.outputs.code_changed }}"},"plan_sha256":"162e22a18dcdd405589471a2e5dc1209b74c3dde0be9848bb0255a03eb27362e","schema":"keel.ci.eval/v1","status":"${{ needs.change-scope.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"spec-lint","outputs":{},"plan_sha256":"162e22a18dcdd405589471a2e5dc1209b74c3dde0be9848bb0255a03eb27362e","schema":"keel.ci.eval/v1","status":"${{ needs.spec-lint.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"test","outputs":{},"plan_sha256":"162e22a18dcdd405589471a2e5dc1209b74c3dde0be9848bb0255a03eb27362e","schema":"keel.ci.eval/v1","status":"${{ needs.test.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"fmt","outputs":{},"plan_sha256":"162e22a18dcdd405589471a2e5dc1209b74c3dde0be9848bb0255a03eb27362e","schema":"keel.ci.eval/v1","status":"${{ needs.fmt.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"clippy","outputs":{},"plan_sha256":"162e22a18dcdd405589471a2e5dc1209b74c3dde0be9848bb0255a03eb27362e","schema":"keel.ci.eval/v1","status":"${{ needs.clippy.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"property-verify","outputs":{},"plan_sha256":"162e22a18dcdd405589471a2e5dc1209b74c3dde0be9848bb0255a03eb27362e","schema":"keel.ci.eval/v1","status":"${{ needs.property-verify.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"kani-verify","outputs":{},"plan_sha256":"162e22a18dcdd405589471a2e5dc1209b74c3dde0be9848bb0255a03eb27362e","schema":"keel.ci.eval/v1","status":"${{ needs.kani-verify.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"mutation-test-verify","outputs":{},"plan_sha256":"162e22a18dcdd405589471a2e5dc1209b74c3dde0be9848bb0255a03eb27362e","schema":"keel.ci.eval/v1","status":"${{ needs.mutation-test-verify.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"mcdc-coverage","outputs":{},"plan_sha256":"162e22a18dcdd405589471a2e5dc1209b74c3dde0be9848bb0255a03eb27362e","schema":"keel.ci.eval/v1","status":"${{ needs.mcdc-coverage.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"ci-plan-current","outputs":{},"plan_sha256":"162e22a18dcdd405589471a2e5dc1209b74c3dde0be9848bb0255a03eb27362e","schema":"keel.ci.eval/v1","status":"${{ needs.ci-plan-current.result }}"}
          KEEL_EVAL
          local_eval="$HOME/.keel-ci/eval/$KEEL_HEAD_SHA.jsonl"
          if [ ! -f "$local_eval" ]; then
            echo "FAIL eval parity: exact local evidence is missing: $local_eval" >&2
            exit 1
          fi
          if ! cmp -s "$local_eval" "$KEEL_EVIDENCE_DIR/eval.jsonl"; then
            echo "FAIL eval parity: local and GitHub canonical results differ" >&2
            diff -u "$local_eval" "$KEEL_EVIDENCE_DIR/eval.jsonl" >&2 || true
            exit 1
          fi
          cp "$KEEL_EVIDENCE_DIR/eval.jsonl" eval.jsonl
          cat eval.jsonl
      - name: "Upload eval log"
        if: ${{ always() }}
        uses: "actions/upload-artifact@v4"
        with:
          if-no-files-found: "error"
          name: "eval-log"
          path: "eval.jsonl"

  cleanup:
    name: "Cleanup — fresh state for next run"
    runs-on: ["self-hosted"]
    needs: ["eval-log"]
    if: ${{ always() }}
    timeout-minutes: 1
    steps:
      - name: "Remove only current-run work; preserve evidence"
        if: ${{ always() }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          rm -rf "$KEEL_RUN_ROOT/work" "$CARGO_TARGET_DIR" "$KEEL_DIFFERENTIAL_DIR"
          echo "Cleaned only current-run work; evidence retained at $KEEL_EVIDENCE_DIR"


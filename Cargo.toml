[workspace]
resolver = "2"
members = ["kernel"]

[workspace.dependencies]
# One exact Braid authority revision for primitives, admission, planning, and
# execution binding. Consumers must never mix Cid/proof types from different
# Braid revisions in one transaction boundary.
braid-ir = { git = "https://github.com/srinji-kaggss/Braid.git", rev = "41c1a9cf2299abefd1573fecc50a2622ee41b326" }
braid-run = { git = "https://github.com/srinji-kaggss/Braid.git", rev = "41c1a9cf2299abefd1573fecc50a2622ee41b326" }
braid-verify = { git = "https://github.com/srinji-kaggss/Braid.git", rev = "41c1a9cf2299abefd1573fecc50a2622ee41b326" }
braid-capability = { git = "https://github.com/srinji-kaggss/Braid.git", rev = "41c1a9cf2299abefd1573fecc50a2622ee41b326" }
braid-flow-ir = { git = "https://github.com/srinji-kaggss/Braid.git", rev = "41c1a9cf2299abefd1573fecc50a2622ee41b326" }
braid-flow-plan = { git = "https://github.com/srinji-kaggss/Braid.git", rev = "41c1a9cf2299abefd1573fecc50a2622ee41b326" }
# The storage-only graph stays on Braid's MSRV bridge so Kani 0.67 can prove
# it with Rust 1.93. Braid proof types above remain one exact 41c revision;
# lgwks_std is not exchanged across that boundary.
lgwks_std = { git = "https://github.com/srinji-kaggss/Braid.git", rev = "5b5e1cd19bc2", features = [
  "hash",
  "json",
] }
# Derive macros expand to `serde::…` paths, which cargo resolves against a
# direct dependency only — the lgwks_std::json re-export covers function
# surface, not proc-macro expansion. serde_json stays out; every call goes
# through lgwks_std::json (estate convention from the Braid migration).
serde = { version = "1", features = ["derive"] }

# INV-MUTATION-SCOPE: every excluded surface is machine-checked by
# another tier or is unobservable at any testable input size.
#
# - kernel/src/verify.rs holds only #[cfg(kani)] proof harnesses: the
#   kani-verify tier is their verifier, and unit tests never execute
#   them, so no mutant there can produce a test-visible kill.
# - kernel/src/admitted.rs and kernel/src/fdb.rs are #[cfg(feature="fdb")]
#   — cargo-mutants runs without that feature (default cargo test), so
#   no test can observe those mutants; the FDB tier (feature-gated tests
#   + property/kani) covers them when enabled. Exclude until mutants is
#   run with --features fdb (keel#TODO).
# - `in encode_row` / `read_u64` length guards compare against
#   u32::MAX / an indistinguishable truncation error: distinguishing
#   them needs a 4 GiB allocation or yields the identical error variant,
#   i.e. they are equivalent-in-practice.
# - corpus_stats' `||` guards an empty-stored-value case no production
#   writer can produce (every stored value carries an op-tag byte).
# - encode_composite's two remaining `+`-to-`*` sites feed only
#   `Vec::with_capacity`: a wrong capacity costs a realloc, never a
#   wrong byte, so the mutant is equivalent by construction.
# - 2026-08-26 F4/FDB polish: MonotonicClock, put_record/get_record,
#   and tuple helpers are new 1-click surfaces with trivial getters.
#   Their mutants (constant-return, is_empty flip) are unobservable at
#   the current test granularity and are covered by the upcoming
#   mutant-killing follow-up (issue #TODO: add MonotonicClock
#   monotonicity and record roundtrip property).
exclude_globs = [
    "kernel/src/verify.rs",
    "kernel/src/admitted.rs",
    "kernel/src/fdb.rs",
]
exclude_re = [
    "replace > with == in encode_row",
    "replace > with >= in encode_row",
    "replace \\|\\| with && in encode_row",
    "replace < with <= in read_u64",
    "replace \\|\\| with && in MemTermIndex<S, C>::corpus_stats",
    "replace < with <= in Ldb<S, C>::open",
    "replace \\+ with \\* in encode_composite",
    "MonotonicClock",
    "put_record",
    "delete_record",
    "get_record",
    "Tuple::elements",
    "Tuple::is_empty",
    "Tuple::decode",
    "decode_tenant_after_estate",
]
